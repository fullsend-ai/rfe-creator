- 'A well-formed need under a title that does not describe it, with a draft note left in the text
  (issue #299, from RHAIRFE-3899 on 2026-11-12). The body passes the rubric, so the scores say nothing
  is wrong; the only correct signal is needs_attention with the mismatch as the reason (source rubric,
  dimension what, or agent). The production reviewer wrote the mismatch into its feedback and still
  set the flag false; the parallel dry reviewer of the same slot flagged it. The create step must keep
  the requester''s title and note: a baseline that shows it retitling means the anchor is too weak,
  not that the rule is wrong. expected_pass states the intent (the body passes the rubric); no deterministic
  judge reads it. expected_needs_attention_reason is read by needs_attention_expectation: the flag''s reason
  must mention the title, so an unrelated flag does not satisfy the case.'
