# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
agents:
  - source: rfe-creator/rfe-creator.yaml
  - name: code
    runtime: claude
    model: opus
  - name: fix
    model: sonnet
  - name: prioritize
    runtime: pi
    model: google-vertex/gemini-3.8-flash
  - name: review
    runtime: pi
    model: sonnet
    subagents:
      challenger: opus
      correctness: openai/gpt-6.1-sol
      docs-currency: google-vertex/gemini-3.8-flash
      intent-coherence: google-vertex/gemini-3.8-flash
      risk-assessment: google-vertex/gemini-3.8-flash
      security: openai/gpt-6.1-sol
      style-conventions: google-vertex/gemini-3.8-flash
  # Mirrors fullsend-ai/fullsend: retro held off while duplicate findings are reduced
  # (fullsend-ai/agents#198, fullsend#7805); the role stays installed.
  - name: retro
    model: sonnet
    enabled: false
  - name: triage
    model: sonnet
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/fullsend-ai/rfe-creator/

# fullsend fleet agents: same runtime and model selection as fullsend-ai/fullsend.
runtime: claude
roles:
  - fullsend
  - triage
  - coder
  - review
  - retro
  - prioritize
# Same upstream target as the fullsend-managed configs in this batch: triage and
# retro may file platform prerequisites on fullsend-ai/fullsend (this repo is
# always implicitly allowed).
create_issues:
  allow_targets:
    repos:
      - fullsend-ai/fullsend
status_notifications:
  reaction:
    start: enabled
    completion: enabled
