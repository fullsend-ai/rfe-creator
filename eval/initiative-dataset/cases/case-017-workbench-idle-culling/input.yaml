prompt: 'A three-quarter programme across the notebooks, serving and platform-operations teams to stop idle interactive
  workloads: workbenches, development model endpoints and pipeline debug pods that nobody is using get stopped after
  a policy window, with owner notices and admin reporting. There is no problem we can point to — nobody asked, nothing
  is measured — the platform simply does not do this, so it is filed as "we want the capability" under the cost-efficiency
  theme so the idea is not lost.'
clarifying_context: 'What the three teams would deliver, as four workstreams over three quarters: (1) one idle signal
  shared by every interactive workload type — no kernel activity, no open session, no request traffic — owned by
  platform operations; (2) a policy engine where an administrator sets an idle window per project or cluster-wide,
  with exemptions, that stops (never deletes) workbenches, development model endpoints and pipeline debug pods,
  split between the notebooks and serving teams; (3) owner notices in the dashboard with a one-click restart; (4)
  an admin report of what the policy stopped. The default is off everywhere so nothing changes for anyone who does
  not opt in. It is filed under the platform cost-efficiency theme because that is the drawer idle-compute work
  goes in, not because anyone has shown a cost — do not cite the theme as the reason for doing this. It would be
  broken into epics per team later.


  On the problem side there is nothing. Nobody has reported idle workloads as a problem, nobody has measured anything,
  no customer or internal team has asked, we have not looked at other platforms, and we do not have a theory about
  waste that we would stand behind. The only honest problem statement is that the platform has no policy that stops
  idle interactive workloads. If the write-up needs a problem statement, write exactly that sentence — "The platform
  has no policy that stops idle interactive workloads." — and stop there. Do not add a belief about GPU cost, do
  not present the cost-efficiency theme as a rationale, do not say the teams suspect anything, do not propose measuring
  first; none of that is ours to claim, and we would rather a reviewer flag the missing rationale than have one
  written for us.


  Boundaries as far as we have them: interactive workloads only, not batch training jobs or production model servers;
  stop, never delete, volumes and image selections stay; no per-user quotas or chargeback, which is a different
  programme. We have no preference on how the idle signal is detected and would leave that to the teams.'
priority: Normal
