# Typed prose for the generated eval config (eval.yaml). The structure, the shared judges and
# every check live in eval/config/skeleton.yaml; identity, dirs, score fields and thresholds
# come from type.yaml. Schema: types/_schema/eval-fragment.schema.json.
# Regenerate with: python3 scripts/generate_eval_config.py
schema_version: 1
entity_long: RFE (Request for Enhancement)
execution:
  timeout_note: 3 hours — 26 rfe / 21 initiative cases at opus pace ran 105–110 min on 2026-09-22 with three evals sharing the runners; 2 h left no headroom
dataset:
  prompt: Concise problem statement (1-2 sentences)
  clarifying_context: |
    - clarifying_context (string): Extended business context with
      customer segments, justification, scope, success criteria
inputs:
  questions_context: |
    clarifying questions during rfe-create (customer segment,
    business impact, problem definition, distinctness, success metrics).
  questions_answer: |
    Use the 'clarifying_context' field for customer segments,
    business justification, and scope details.
    Use the 'prompt' field for the core problem statement.
outputs:
  task_fields: |
    rfe_id, title, priority (Blocker/Critical/Major/Normal/Minor),
    size (S/M/L/XL), status (Draft/Ready/Submitted/Archived),
    parent_key (for split children), original_labels.
  task_sections: |
    Body sections: Summary, Problem Statement, Affected Customers,
    Business Justification, Acceptance Criteria, Success Criteria.
  review_files: |
    {ID}-feasibility.md: Technical feasibility assessment with
      blockers, strategy considerations, scope assessment.
  review_body: |
    Body of review: Assessor Feedback table (Criterion, Score, Notes),
    Verdict, Feedback, Technical Feasibility, Strategy Considerations,
    Revision History.
architecture_context:
  # RFEs always get architecture-grounded feasibility reviews: no "not relevant" carve-out.
  not_relevant_pattern: null
  not_relevant_note: ""
quality:
  criteria: |
    - Describe a clear business need (WHAT) — user-centric, not task-like
    - Be justified with evidence (WHY) — named customers, revenue impact
    - Not prescribe implementation (no HOW) — platform vocabulary is OK,
      but "must use X" is not
    - Describe a need, not an activity (Not a Task)
    - Be right-sized for a single strategy feature
  extra_checks: ""
revision:
  assessments: |
    **Revision quality**: Did revisions genuinely improve the RFE?
    Clarified requirements, strengthened justification, reframed
    prescriptive content? Or just cosmetic/lateral changes?

    **Content fidelity**: Was important business content preserved?
    Customer names, requirements, justification data intact?
    Or was critical content lost during revision?

    **Reframing quality**: When prescriptive/HOW content was reframed,
    was the intent preserved while removing implementation bias?
    Or was it simply deleted without reframing the underlying need?
threshold_notes:
  revision_coverage: |
    with 29 cases of which 6 are tagged revision-expected (case-021 to
    case-026), 4 of 6 revised leaves 2 failures -> 27/29 = 0.931 (pass); 3 of 6
    revised leaves 3 failures -> 26/29 = 0.897 (fail). case-026 (a maintenance
    checklist with no business evidence) calibrated on 2026-09-21 as a
    one-revision pass: first review 5/10 (WHY 0, not_a_task 0), revised once to
    9/10 — the reviser pads WHY to 1 with a generic segment despite the draft's
    do-not-pad anchor, so an "unfixable WHY" cannot be engineered reliably.
    Second-revision coverage (AISDLC-45) comes instead from drafts whose first
    revision does not pass: RFE-024 reached cycle 2 in both 2026-09-21 rfe runs
    and RFE-021 in one. The 2-failure slack is shared:
    a tagged draft the create step repairs on its own, a tagged draft the
    first review rejects or splits instead of revising (correct pipeline
    behaviour, but it never enters the revise path and leaves no evidence),
    and any case without a review file each consume one failure. Calibrated on
    two live 5-case runs (2026-09-07): drafts weak only by wording were
    repaired at create time in 4 of 5; drafts with an in-character "no
    customer evidence, do not pad" anchor were revised in 5 of 5. A multi-item run that
    holds a tagged case and revised nothing fails every case (0.0). Single-item runs
    (Harbor tasks, execution.mode: case) and runs without a tagged case (quick
    mode's first two cases, a --cases subset, a Jira-sourced batch) skip the
    run-level check and are decided by the tag alone. Untagged cases otherwise
    always pass.
  needs_attention_expectation: |
    1.0 over the annotated cases. Expected true on case-027 (only the
    classification flag naming the Initiative satisfies it) and, since issue
    #299, on case-029: a well-formed need under a title that does not describe
    it, with a draft note left in the text, so the body passes and the flag is
    the only signal the case produces (source rubric or agent, not
    classification). One miss fails the gate by design: the rules say a concern
    the review records that the scores do not reflect sets the flag. The
    production reviewer missed exactly that on RHAIRFE-3899 (2026-11-12) while
    the parallel dry reviewer of the same slot flagged it; the case's first
    baseline is the eval run of the PR that added it.
  classification_signal: |
    stage 2 of classification (AISDLC-191/192): a case's expected_classification
    is none (must not be flagged), the type the item really is (must be flagged,
    naming it) or absent (not checked: the boundary cases case-015 and case-017,
    which read as programmes filed as RFEs). The check has two cases of its own:
    case-027, an Initiative described as an RFE (must be flagged "likely an
    Initiative"), and case-028, a genuinely ambiguous idea (must not be flagged);
    every other annotated case must not be flagged either, so the check measures
    precision over the dataset as well. With 29 cases, 0.92 allows 2 failures,
    which makes this threshold a precision gate: the misfiled case's recall is
    pinned by needs_attention_expectation at 1.0, which on a case whose
    expected_classification names a type accepts only the classification flag
    naming that type (expected_needs_attention: true on case-027).
    Baseline 2026-11-03 (run 2026-11-03-opus-4-6 on ef82342, eval pipeline
    3021822252): 27/28 = 0.964. Precision was perfect — no regular or weak-draft
    case flagged — and the one miss was case-027 itself: the reviewer read the
    RFE template's shape (problem statement, named customers, acceptance
    criteria) as evidence of an RFE, called a three-team, three-quarter
    programme under an Outcome "clearly an RFE" and recommended a split. The
    rules now say to judge the substance rather than the shape and name that
    split as the misfiled case. Second run with the sharpened rule, 2026-11-03 (run 2026-11-03-opus-4-6 on
    be79aef, eval pipeline 3023147047): 28/28. case-027 was flagged "likely an
    Initiative: names several teams in a joint programme ..." under source
    classification (the split stays recommended, as the rules require) and no
    other case was flagged; needs_attention_expectation 1.0. The value stays at
    0.92.
