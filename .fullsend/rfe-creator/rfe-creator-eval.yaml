---
# Eval variant of rfe-creator.yaml: same prompt, scripts, image, policy, gates
# (the validation loop's DONE gate, pre-script, post-script), but no Jira access
# and the models under evaluation injected from outside. fullsend composes this
# file over its base (mergeBaseIntoChild in internal/harness/compose.go):
# non-empty scalars override, env.sandbox / env.runner merge with these keys
# winning, validation_loop merges field by field (child non-zero wins), and
# providers / openshell.profiles are concatenated, base first and this file last.
# The same-identity replacement happens later, at resolve time
# (internal/cli/run.go): dedupResolvedProviders by provider name and
# dedupResolvedProfiles by profile id, last wins, so the entries here replace the
# base entries of the same name / id. Entries cannot be removed, so "no Jira" is
# an override here.
#
# `model` is not set: `fullsend run --model` passes the model under evaluation.
# tests/test_fullsend_eval_harness.py pins this file to the keys below.
#
# fullsend resolves `base` relative to this file's directory, unlike the
# fullsend-dir-relative paths below (rfe-creator/rfe-creator.yaml would look for
# .fullsend/rfe-creator/rfe-creator/rfe-creator.yaml).
base: rfe-creator.yaml
# The production prompt under this harness's name. fullsend's Claude runtime
# refuses a prompt whose frontmatter name is not the harness name (Claude Code
# resolves --agent by frontmatter name; fullsend-ai/fullsend#6764), and
# prompt.md declares `rfe-creator`. prompt-eval.md differs from it only in the
# frontmatter; a test keeps the bodies identical.
agent: rfe-creator/prompt-eval.md

# Below the eval's execution.timeout (10800 s); the full 26-case batch took
# 105-110 minutes under claude-code.
timeout_minutes: 170

# validation_loop is inherited (max_iterations: 2, feedback append). The first
# fullsend eval run that completed the pipeline ended its turn on the skill's
# own summary without writing agent-result.json (rfe-creator-eval job
# 17541721893, "FAIL: output/agent-result.json not found"); with one iteration
# fullsend skips the post-script and every artifact is lost. The second
# iteration resumes from tmp/pipeline-state.yaml (phase DONE) and only writes
# the result file. timeout_minutes is a per-iteration budget, but fullsend
# starts a second iteration only when the agent finished and its output failed
# validation, never after a timeout, so a first iteration that ran out of time
# is not followed by a second 170-minute one.

env:
  sandbox:
    # Literals: the base reads ${JIRA_SERVER}/${JIRA_USER}, which would
    # otherwise be required on the host.
    JIRA_SERVER: "https://redhat.atlassian.net"
    JIRA_USER: "eval"
    # Exported by the eval runner; the base pins a literal.
    CLAUDE_CODE_SUBAGENT_MODEL: "${AGENT_EVAL_SUBAGENT_MODEL}"
  runner:
    # Literals, so a host without Jira credentials passes env validation.
    JIRA_SERVER: "https://redhat.atlassian.net"
    JIRA_USER: "eval"
    JIRA_TOKEN: "eval-no-jira"

openshell:
  profiles:
    # Replaces the read-only Jira profile (id: jira): no Atlassian egress.
    - rfe-creator/jira-profile-eval.yaml
providers:
  # Replaces the production provider (name: jira) with a literal credential.
  - rfe-creator/jira-provider-eval.yaml
